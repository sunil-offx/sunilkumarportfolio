  <text x="64" y="170" fill="#eae7e0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="700">Sunilkumar B</text>
  <text x="64" y="220" fill="#5eead4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">AI &amp; ML Engineer</text>
